<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive · cadrans</title>
<meta name="theme-color" content="#e1ecf7">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<style>
:root{
  --text:#1f2b3d; --muted:#6a7890; --line:rgba(31,43,61,.10);
  --card:rgba(255,255,255,.58); --card-solid:#f7fbfd; --hover:rgba(255,255,255,.75);
  --accent:#3b7ddd; --sel:rgba(59,125,221,.16); --sel-ring:rgba(59,125,221,.55);
  --drop:rgba(46,158,91,.16); --drop-line:#2e9e5b; --danger:#c84545;
  --edm:#EC5A64; --edm-navy:#144162; --perso:#3b7ddd;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--text);
  background:linear-gradient(160deg,#eaf7f8 0%,#e1ecf7 50%,#d5e2f4 100%);display:flex;flex-direction:column;min-height:560px}
body::before{content:"";display:block;height:4px;background:linear-gradient(90deg,#7fd3d8,#8fb8ec 60%,#a9c3f0)}
button{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
header.top h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.1px}
.grp{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;font-size:13px}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;background:var(--card);border:1px solid rgba(255,255,255,.8);box-shadow:0 1px 3px rgba(31,43,61,.06)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--text);font-weight:600;font-size:13px}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(31,43,61,.12)}
.grow{flex:1}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600}
.busy{color:var(--accent);font-weight:700;font-size:13px;display:none}
.busy.on{display:inline}
.pill-btn{border:1px solid rgba(255,255,255,.85);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px}
.pill-btn:hover:not(:disabled){background:#fff}
.pill-btn:disabled{opacity:.45;cursor:default}
#banner{display:none;margin:0 16px 6px;padding:9px 14px;border-radius:12px;background:#fff4d6;color:#5f4500}
#banner.on{display:block}
main{flex:1;display:grid;gap:12px;padding:4px 14px 14px;min-height:0}
main[data-layout="cols"]{grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
main[data-layout="rows"]{grid-template-rows:repeat(var(--n),minmax(0,1fr));grid-template-columns:minmax(0,1fr)}
main[data-layout="grid"]{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
main[data-layout="grid"][data-n="1"]{grid-template-columns:minmax(0,1fr)}
main[data-layout="grid"][data-n="3"] .pane:nth-child(3){grid-column:span 2}
.pane{container-type:inline-size;background:var(--card);border:1px solid rgba(255,255,255,.75);border-radius:18px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;
  box-shadow:0 6px 28px rgba(40,70,110,.09);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pane-head{display:flex;align-items:center;gap:7px;padding:9px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.space{font-size:11px;font-weight:800;letter-spacing:.3px;color:#fff;border-radius:999px;padding:2px 9px;flex-shrink:0}
.space.perso{background:var(--perso)} .space.edm{background:var(--edm)}
.crumbs{display:flex;align-items:center;gap:1px;flex:1;min-width:140px;overflow:hidden;white-space:nowrap}
.crumb{border:0;background:none;padding:3px 6px;border-radius:7px;cursor:pointer;max-width:170px;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;font-weight:600;color:var(--muted)}
.crumb:hover{background:var(--hover)}
.crumb.last{font-weight:800;color:var(--text);flex-shrink:0}
.sep{color:var(--muted)}
.ibtn{border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.5);border-radius:9px;padding:4px 7px;cursor:pointer;display:inline-flex;align-items:center;color:var(--text)}
.ibtn:hover{background:#fff}
.ibtn:disabled{opacity:.35;cursor:default;background:transparent}
select,input[type=search]{font:inherit;font-size:13px;color:var(--text);background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:9px;padding:4px 7px;max-width:190px}
input[type=search]{width:110px}
.pane-body{flex:1;overflow:auto;position:relative;min-height:0}
.pane-body.ncol{overflow:hidden}
.drop-on{background:var(--drop)!important;box-shadow:inset 0 0 0 2px var(--drop-line)}
.ins-before{box-shadow:inset 4px 0 0 var(--accent)!important;background:rgba(59,125,221,.07)!important}
.ins-after{box-shadow:inset -4px 0 0 var(--accent)!important;background:rgba(59,125,221,.07)!important}
.drop-target{background:var(--drop)!important;box-shadow:inset 0 0 0 2px var(--drop-line)}
.status{padding:5px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;display:flex;gap:12px;white-space:nowrap;overflow:hidden}
.msg{padding:26px 18px;color:var(--muted);text-align:center;font-weight:600}
.msg.err{color:var(--danger)}
.msg .help{max-width:440px;margin:10px auto 0;font-weight:500;line-height:1.5;text-align:left;color:var(--text)}
.msg button{margin-top:10px}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{background:var(--sel)!important;box-shadow:inset 0 0 0 1.5px var(--sel-ring)}
.ico{display:inline-flex;width:22px;height:22px;flex-shrink:0}
.ico svg{width:100%;height:100%}
.ico{position:relative}
.imp{position:absolute;left:-5px;top:-5px;width:13px;height:13px;border-radius:50%;background:#e5383b;color:#fff;font:800 10px/13px system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px #fff;pointer-events:auto}
.art .imp{left:-4px;top:-4px;width:22px;height:22px;font-size:15px;line-height:22px}
.tile.important .name{color:#c1121f}
.impbtn{font:800 14px/1 system-ui,sans-serif;color:#c1121f}
.impbtn.on{background:#e5383b !important;color:#fff !important}
.count{background:#fff;color:var(--text);font-weight:800;border-radius:999px;box-shadow:0 1px 3px rgba(31,43,61,.22);white-space:nowrap}
.count:empty{display:none}
.tag{font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px;white-space:nowrap;flex-shrink:0}
.tag.edm{background:var(--edm);color:#fff}
.tag.ext{background:#ecc85a;color:#4a3800}
/* Liste */
.list .row{display:grid;grid-template-columns:24px minmax(0,1fr) 104px 64px;align-items:center;gap:9px;padding:5px 12px;user-select:none;cursor:default}
.list .row:not(.hdr):hover{background:var(--hover)}
.list .hdr{position:sticky;top:0;background:var(--card-solid);color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);z-index:1}
.list .nm{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600}
.list .count,.citem .count{font-size:11px;padding:0 7px}
.hdr button{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);text-align:left;font-size:12px;font-weight:600}
.hdr button.on{color:var(--text);font-weight:800}
@container (max-width:430px){
  .list .row{grid-template-columns:24px minmax(0,1fr)}
  .list .row > :nth-child(3), .list .row > :nth-child(4){display:none}
}
/* Icônes */
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:20px 8px;padding:20px 12px;align-content:start}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 4px 10px;border-radius:16px;text-align:center;user-select:none}
.tile:hover{background:var(--hover)}
.art{position:relative;width:84px;height:68px;display:flex;align-items:center;justify-content:center}
.art svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(31,43,61,.10))}
.art.file svg{width:68px;height:68px}
.art .count{position:absolute;right:-12px;bottom:-8px;font-size:15px;padding:1px 10px;min-width:30px;text-align:center}
.art .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%)}
.tile .nwrap{position:relative;align-self:stretch;height:30px}
.tile .name{position:absolute;left:0;right:0;top:0;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12px;font-weight:700;word-break:break-word;line-height:1.25;padding:0 3px;border-radius:7px}
.list .row:not(.hdr):hover .name,.citem:hover .name{white-space:normal;overflow:visible;word-break:break-word}
.tile:hover .name{-webkit-line-clamp:unset;display:block;overflow:visible;z-index:6;background:#fff;box-shadow:0 3px 12px rgba(31,43,61,.16);padding:2px 5px}
/* Colonnes */
.columns{display:flex;height:100%;overflow-x:auto;overflow-y:hidden}
.col{flex:0 0 230px;border-right:1px solid var(--line);overflow-y:auto;height:100%;padding:4px 0;position:relative}
.colwrap{position:relative;flex:0 0 auto;height:100%;display:flex}
.colwrap .col{flex:1 1 auto}
.cgrip{position:absolute;top:0;right:-6px;width:12px;height:100%;cursor:col-resize;z-index:4}
.cgrip::after{content:"";position:absolute;left:4px;top:50%;width:4px;height:34px;margin-top:-17px;border-radius:3px;background:rgba(31,43,61,.22);opacity:.55;transition:opacity .15s,background .15s}
.cgrip:hover::after{background:var(--accent)}
.colwrap:hover .cgrip::after,.cgrip.on::after{opacity:1}
.cgrip.on::after{background:var(--accent)}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}
.citem{display:flex;align-items:center;gap:7px;padding:5px 8px;margin:1px 5px;border-radius:9px;user-select:none;font-weight:600}
.citem:hover{background:var(--hover)}
.citem.open-path{background:#fff;font-weight:800}
.chev{color:var(--muted);flex-shrink:0}
.citem .count{margin-left:auto}
.preview{flex:0 0 calc(100% - 230px);min-width:380px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.pv-top{display:flex;align-items:center;gap:10px}
.pv-top .ico{width:30px;height:30px}
.pv-meta{font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-wrap:wrap;gap:4px 12px}
.pv-box{flex:1;min-height:0;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(31,43,61,.08);overflow:auto;display:flex;align-items:center;justify-content:center}
.pv-box iframe{width:100%;height:100%;border:0;align-self:stretch}
.pv-box img{max-width:100%;max-height:100%;object-fit:contain}
.pv-box pre{align-self:stretch;width:100%;margin:0;padding:14px;font-size:12px;white-space:pre-wrap;word-break:break-word}
.preview .art{margin-bottom:14px}
.preview .pv-name{font-weight:800;word-break:break-word;flex:1}
.preview.wide{flex-basis:100%}
.pv-top .ibtn.sq{padding:4px 9px;font-size:15px;line-height:1;background:#fff;border-color:var(--line)}
.sbar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.35)}
.sbar input[type=search]{flex:1;max-width:none;width:auto;font-size:14px;padding:6px 10px}
.sbar .sico{color:var(--muted);display:inline-flex}
.scb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer}
.ibtn.on{background:#fff;color:var(--accent,#2f6fd6);border-color:var(--line)}
.list .srow{grid-template-columns:24px minmax(0,1fr) minmax(90px,34%) 96px}
.sloc{all:unset;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 6px;border-radius:7px}
.sloc:hover{background:#fff;color:var(--text);text-decoration:underline}
.syncst{all:unset;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);padding:3px 8px;border-radius:8px}
.syncst:hover{background:#fff;color:var(--text)}
.syncst.err{color:var(--danger)}
.pclose{margin-left:2px;font-size:17px;line-height:1;padding:3px 8px}
.pclose:hover{background:#fde8e8;color:var(--danger)}
.preview dl{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;margin:0 0 16px;font-size:12.5px}
.preview dt{color:var(--muted);font-weight:600}
.preview dd{margin:0;word-break:break-word}
a.btn{display:inline-block;padding:6px 13px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}
/* Menus et messages */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;z-index:20;align-items:center}
.toast{background:#1f2b3d;color:#fff;padding:9px 10px 9px 15px;border-radius:12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 22px rgba(0,0,0,.22);max-width:600px;font-size:13.5px}
.toast.err{background:var(--danger)}
.toast button{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:2px 10px;cursor:pointer}
.toast button.x{border:0;font-size:17px;line-height:1;padding:0 4px}
#ghost{position:fixed;top:-200px;left:-200px;padding:6px 12px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.menu{position:fixed;z-index:40;background:#fff;border-radius:14px;box-shadow:0 12px 36px rgba(31,43,61,.25);padding:6px;min-width:230px;max-width:340px}
.menu .mt{padding:8px 10px 4px;font-weight:800;font-size:13px;word-break:break-word}
.menu .ms{padding:0 10px 8px;color:var(--muted);font-size:12px;font-weight:600}
.menu button.mi{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:700}
.menu button.mi:hover,.menu button.mi:focus{background:#eef4fd;outline:none}
.menu button.mi small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:1px}
.menu a.mi{display:block;padding:8px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-weight:700}
.menu a.mi:hover{background:#eef4fd}
.menu .sw{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px 8px}
.menu .sw button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(31,43,61,.15);cursor:pointer;padding:0}
.menu .sw button.on{box-shadow:0 0 0 2px var(--accent)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,45,.3);display:flex;align-items:center;justify-content:center;z-index:30}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:430px;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.modal p{margin:0 0 16px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.modal .acts button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600}
.modal .acts button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.acct{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.85);background:var(--card);border-radius:999px;padding:4px 11px 4px 6px;cursor:pointer;font-weight:700;font-size:12.5px}
.acct:hover{background:#fff}
.acct .dot{width:10px;height:10px;border-radius:50%;background:#c7ced9}
.acct.on .dot{background:#2e9e5b}
.acct .k{color:#fff;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:800}
.acct .k.perso{background:var(--perso)} .acct .k.edm{background:var(--edm)}
.acct .em{color:var(--muted);font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct.need{border-color:#f0b4b7;background:#fff2f2}
.setup{max-width:620px;margin:30px auto;background:#fff;border-radius:18px;padding:24px 26px;box-shadow:0 10px 34px rgba(40,70,110,.14);line-height:1.55}
.setup h2{margin:0 0 10px;font-size:18px}
.setup ol{padding-left:20px}
.setup code{background:#eef3f9;border-radius:6px;padding:1px 6px;font-size:12.5px;word-break:break-all}
.setup input{width:100%;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid #cfd8e3;margin:8px 0 12px}
.bm{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--accent);color:#fff!important;font-weight:800;text-decoration:none;cursor:grab}
.menu .help{padding:4px 10px 10px;font-size:12.5px;line-height:1.5;color:var(--text)}
.menu .help p{margin:0 0 8px}
</style>
</head>
<body>
<header class="top">
  <h1>Drive · cadrans</h1>
  <span id="accts" class="grp"></span>
  <span class="grp">Cadrans <span class="seg" id="segCount"></span></span>
  <span class="grp">Disposition <span class="seg" id="segLayout"></span></span>
  <label class="chk"><input type="checkbox" id="chkConfirm"> Confirmer les déplacements</label>
  <span class="grow"></span>
  <span class="busy" id="busy"></span>
  <button class="syncst" id="syncSt" title="Synchronisation des réglages entre postes"></button>
  <button class="pill-btn" id="btnRefreshAll" title="Relire tous les dossiers affichés depuis Google Drive">Actualiser</button>
  <button class="pill-btn" id="btnUndo" disabled title="Annuler la dernière opération">Annuler</button>
  <button class="pill-btn" id="btnHelp" title="Aide et lancement depuis Drive">?</button>
</header>
<div id="banner"></div>
<main id="main"></main>
<div id="toasts"></div>
<div id="ghost"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
"use strict";
/* ===== Configuration ===== */
const CLIENT_ID_BUILTIN = "476716885235-rj6c7r2te6v6md334nr8v1o4f9h5875e.apps.googleusercontent.com";          // facultatif : collez ici l'ID client OAuth pour éviter l'écran de configuration
const SCOPE = "https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/drive.appdata";
const API = "https://www.googleapis.com/drive/v3/";
const ACCTS = {
  perso:{key:"perso", label:"Perso", hint:"manuel.zacklad@gmail.com"},
  edm:{key:"edm", label:"EDM", hint:"contact@ecole-edm.fr"}
};
const ACCT_KEYS = ["perso","edm"];
const EDM_EMAIL = "contact@ecole-edm.fr";
const VIRT = {root:"Mon Drive", shared:"Partagés avec moi", starred:"Favoris", important:"Importants"};
const isVirt = id => id === "shared" || id === "starred" || id === "important";
const FOLDER = "application/vnd.google-apps.folder";
const isFolder = it => it.mimeType === FOLDER;
const STORE = "drive-cadrans-web.v1", TOK = "drive-cadrans-web.tok", CFG = "drive-cadrans-web.cfg";
const PAL = {
  amber:["#EBB654","#C8933F"], yellow:["#FBE06B","#E0BC3E"], pink:["#F2A3D8","#C47BAF"], violet:["#8D9FE7","#6677C0"],
  green:["#9DE96B","#6FAF45"], teal:["#80E3DF","#56AFAA"], blue:["#83B9F2","#5590CC"], coral:["#F58C8F","#CC6164"], slate:["#8E9CB1","#677388"]
};
const doFetch = (...a) => (window.__MOCK_FETCH || fetch)(...a);
const gis = () => window.__MOCK_GOOGLE || window.google;
const APP_URL = location.origin + location.pathname;
const APP_VERSION = "2026-11-01.8";
/* Mise à jour automatique : GitHub Pages garde la page en cache 10 min, on vérifie s'il existe une version plus récente */
(async () => {
  try {
    const t = await (await fetch(location.pathname, {cache:"reload"})).text();
    const m = t.match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION && sessionStorage.getItem("dc-reloaded") !== m[1]) { sessionStorage.setItem("dc-reloaded", m[1]); location.reload(); }
  } catch(e) {}
})();

let CLIENT_ID = CLIENT_ID_BUILTIN;
try { const c = JSON.parse(localStorage.getItem(CFG) || "{}"); if (!CLIENT_ID && c.clientId) CLIENT_ID = c.clientId; } catch(e) {}

for (const k of ACCT_KEYS) Object.assign(ACCTS[k], {email:"", token:"", exp:0, rootId:"", drives:[], need:false, tc:null});
try {
  const t = JSON.parse(sessionStorage.getItem(TOK) || "{}");
  for (const k of ACCT_KEYS) if (t[k] && t[k].exp > Date.now()) Object.assign(ACCTS[k], {token:t[k].token, exp:t[k].exp, email:t[k].email || "", rootId:t[k].rootId || "", drives:t[k].drives || [], scope:t[k].scope || ""});

/* ===== Connexion Google ===== */
function needAuth(acct){ const a = ACCTS[acct]; a.token = ""; a.need = true; saveTok(); renderAccts(); }

  return new Promise((res, rej) => {
    const g = gis();

    const a = ACCTS[acct];

    a.tc.callback = async r => {
      if (r.error) { toast("Connexion " + a.label + " refusée : " + (r.error_description || r.error), {err:true}); return rej(new Error(r.error)); }
      a.token = r.access_token; a.scope = r.scope || ""; a.exp = Date.now() + (Number(r.expires_in || 3600) - 90) * 1000; a.need = false;

          api(acct, "GET", "files/root", {query:{fields:"id"}}),
          api(acct, "GET", "drives", {query:{pageSize:100, fields:"drives(id,name)"}}).catch(() => ({drives:[]}))
        ]);

        a.email = about.user.emailAddress; a.rootId = root.id; a.drives = drives.drives || [];
        if (changed) [...cache.keys()].forEach(k => { if (k.startsWith(acct + ":")) cache.delete(k); });

      } catch (e) { toast(errMsg(e), {err:true}); }
      saveTok(); renderAccts();
      for (let i = 0; i < S.count; i++) if (S.panes[i].path[0].acct === acct) { renderPane(i); loadPane(i); }
      resolvePending();

}
async function api(acct, method, path, opt){
  opt = opt || {};

  const url = new URL(API + path);
  if (opt.query) for (const k in opt.query) if (opt.query[k] !== undefined && opt.query[k] !== "") url.searchParams.set(k, opt.query[k]);
  for (let attempt = 0; attempt < 2; attempt++) {
    const r = await doFetch(url.toString(), {method, headers:Object.assign({Authorization:"Bearer " + a.token}, opt.body ? {"Content-Type":"application/json"} : {}), body:opt.body ? JSON.stringify(opt.body) : undefined});
    if (r.status === 401) { needAuth(acct); const e = new Error("auth"); e.code = "needs_auth"; e.acct = acct; throw e; }
    if (r.status === 204) return {};
    const j = await r.json().catch(() => ({}));
    if (r.ok) return j;
    const reason = j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason;

}

/* ===== Lecture des dossiers ===== */
const FIELDS = "nextPageToken,files(id,name,mimeType,parents,owners(emailAddress),modifiedTime,createdTime,size,webViewLink,driveId)";
function listQuery(id){
  const base = {fields:FIELDS, pageSize:1000, supportsAllDrives:true, includeItemsFromAllDrives:true};
  if (id === "root") return Object.assign(base, {q:"'root' in parents and trashed = false", corpora:"user"});
  if (id === "shared") return Object.assign(base, {q:"sharedWithMe = true and trashed = false", corpora:"user"});
  if (id === "starred") return Object.assign(base, {q:"starred = true and trashed = false", corpora:"user"});
  if (id.startsWith("drive:")) { const d = id.slice(6); return Object.assign(base, {q:"'" + qid(d) + "' in parents and trashed = false", corpora:"drive", driveId:d}); }
  return Object.assign(base, {q:"'" + qid(id) + "' in parents and trashed = false", corpora:"allDrives"});
}
function mapFile(f, acct){
  return {acct, id:f.id, title:f.name, mimeType:f.mimeType, parentId:(f.parents || [])[0] || "", owner:(f.owners && f.owners[0] && f.owners[0].emailAddress) || (f.driveId ? "disque partagé" : ""),
    driveId:f.driveId || "", modifiedTime:f.modifiedTime, createdTime:f.createdTime, fileSize:f.size, viewUrl:f.webViewLink};
}
function fetchFolder(acct, id, opt){
  opt = opt || {};

  const have = cache.get(k);
  if (!opt.force && have && (!have.truncated || have.max >= max)) return Promise.resolve(have);
  if (inflight.has(k)) return inflight.get(k).then(() => fetchFolder(acct, id, opt));
  if (id === "important") {
    const p = (async () => {
      const ids = Object.keys(S.marks), items = [];
      const one = async fid => {
        try {
          const f = await api(acct, "GET", "files/" + encodeURIComponent(fid), {query:{fields:"id,name,mimeType,parents,owners(emailAddress),modifiedTime,createdTime,size,webViewLink,driveId,trashed", supportsAllDrives:true}});
          if (!f.trashed) items.push(mapFile(f, acct));
        } catch (e) { if (e.code === "needs_auth") throw e; }
      };
      for (let n = 0; n < ids.length; n += 6) await Promise.all(ids.slice(n, n + 6).map(one));
      const entry = {items, truncated:false, max};
      cache.set(k, entry);
      return entry;
    })();
    inflight.set(k, p);
    p.finally(() => inflight.delete(k)).catch(() => {});
    return p;
  }
  const p = (async () => {
    const items = [], seen = new Set(); let token = null;
    for (let i = 0; i < max; i++) {
      const q = listQuery(id); if (token) q.pageToken = token;
      const res = await api(acct, "GET", "files", {query:q});
      const files = Array.isArray(res.files) ? res.files : [];
      for (const f of files) if (!seen.has(f.id)) { seen.add(f.id); items.push(mapFile(f, acct)); }
      token = res.nextPageToken;
      if (!token || !files.length) { token = null; break; }
    }
    const entry = {items, truncated:!!token, max};
    cache.set(k, entry);
    return entry;
  })();
  inflight.set(k, p);
  p.finally(() => inflight.delete(k)).catch(() => {});
  return p;
}
const cq = [], cqSet = new Set(); let cqRun = 0;
function wantCounts(acct, ids){
  for (const id of ids.slice().reverse()) { const k = ck(acct, id); if (!cache.has(k) && !cqSet.has(k)) { cqSet.add(k); cq.unshift([acct, id]); } }
  pump();
}
function pump(){
  while (cqRun < 3 && cq.length) {

    if (!connected(acct)) { cqRun--; cqSet.delete(k); continue; }
    fetchFolder(acct, id, {max:1}).then(() => updateCounts(k)).catch(() => {}).finally(() => { cqRun--; cqSet.delete(k); pump(); });

}
function updateCounts(k){ const [acct, ...rest] = k.split(":"); const id = rest.join(":"); document.querySelectorAll('[data-count="' + CSS.escape(k) + '"]').forEach(e => { e.textContent = countText(acct, id); }); }
function idsShown(i){ const p = S.panes[i]; return p.mode === "columns" ? p.path.map(c => c.id) : [p.path[p.path.length-1].id]; }

/* ===== Ouverture depuis Drive (?folder=ID) ===== */
async function chainOf(acct, f){
  const fields = "id,name,mimeType,parents,owners(emailAddress),driveId";
  const chain = []; let cur = f, root = null;
  for (let n = 0; n < 15; n++) {
    const pid = (cur.parents || [])[0];
    if (!pid) break;
    if (pid === ACCTS[acct].rootId) { root = rootEntry(acct, "root"); break; }
    const d = ACCTS[acct].drives.find(x => x.id === pid);
    if (d) { root = rootEntry(acct, "drive:" + d.id, d.name); break; }
    try { cur = await api(acct, "GET", "files/" + encodeURIComponent(pid), {query:{fields, supportsAllDrives:true}}); }
    catch (e) { break; }
    nameCache.set(ck(acct, cur.id), cur.name);
    chain.unshift({acct, id:cur.id, title:cur.name, owner:(cur.owners && cur.owners[0] && cur.owners[0].emailAddress) || ""});
  }
  if (!root) root = rootEntry(acct, "shared");
  return {root, chain};
}
let resolving = false;
async function resolvePending(){
  if (!pendingFolder || resolving) return;
  const accts = ACCT_KEYS.filter(connected);
  if (!accts.length) return;
  resolving = true;
  const id = pendingFolder;
  for (const acct of accts) {
    try {
      const fields = "id,name,mimeType,parents,owners(emailAddress),driveId";
      let f = await api(acct, "GET", "files/" + encodeURIComponent(id), {query:{fields, supportsAllDrives:true}});
      const target = mapFile(f, acct);
      const {root, chain} = await chainOf(acct, f);
      const p = S.panes[0];
      if (isFolder(target)) { p.path = [root, ...chain, {acct, id:target.id, title:target.title, owner:target.owner}]; p.preview = null; }
      else { p.path = [root, ...chain]; p.preview = target; p.mode = "columns"; }
      pendingFolder = null;
      document.querySelectorAll(".toast.pending").forEach(t => t.remove());
      try { history.replaceState(null, "", APP_URL); } catch(e) {}
      renderPane(0); loadPane(0); save();
      resolving = false;
      return;
    } catch (e) { /* essai sur l'autre compte */ }
  }
  resolving = false;
  if (accts.length === ACCT_KEYS.length) { toast("Le dossier demandé n'est accessible par aucun des deux comptes.", {err:true}); pendingFolder = null; }
}

/* ===== Glisser-déposer ===== */
function setHL(el, cls){
  if (hl && hl.el !== el) hl.el.classList.remove(hl.cls);
  if (el) { el.classList.add(cls); hl = {el, cls}; } else hl = null;
}
function canDrop(target, copy){
  if (!drag || !target || isVirt(target.id) || !connected(target.acct)) return false;
  const tid = target.id;
  let any = false;
  for (const it of drag.items) {
    if (it.acct !== target.acct) { any = true; continue; }
    if (it.id === tid) return false;
    if ((target.path || []).some(c => c.id === it.id)) return false;
    for (const p of S.panes) {
      if (p.path[0].acct !== target.acct) continue;
      const j = p.path.findIndex(c => c.id === tid);
      if (j > 0 && p.path.slice(0, j).some(c => c.id === it.id)) return false;
    }
    if (copy || keyOf(it.acct, it.parentId) !== tid) any = true;
  }

}
function makeDropTarget(el, getTarget, cls){

    const t = getTarget();
    if (canDrop(t, e.altKey)) { e.preventDefault(); e.dataTransfer.dropEffect = (e.altKey || drag.items[0].acct !== t.acct) ? "copy" : "move"; setHL(el, cls); }
    else setHL(null);

    e.preventDefault(); e.stopPropagation();
    const t = getTarget(), items = drag.items, ev = {x:e.clientX, y:e.clientY, alt:e.altKey};
    endDrag();

  });
}
function endDrag(){ setHL(null); drag = null; }
document.addEventListener("dragover", () => { if (drag) setHL(null); });
document.addEventListener("dragend", endDrag);

async function onDrop(items, target, ev){
  const cross = items[0].acct !== target.acct;
  let op;
  if (cross) op = await dropMenu(items, target, ev.x, ev.y);
  else op = ev.alt ? "copy" : "move";
  if (op === "move" && !cross) doMove(items, target);
  else if (op === "move") doTransfer(items, target, true);
  else if (op === "copy") doTransfer(items, target, false);
}

function attachItem(el, i, it, ctx){

  el.addEventListener("click", e => {

    if (e.shiftKey && anchor[i]) {
      const L = ctx.list, a = L.findIndex(x => x.id === anchor[i]), b = L.findIndex(x => x.id === it.id);
      if (a >= 0 && b >= 0) { s.clear(); L.slice(Math.min(a,b), Math.max(a,b) + 1).forEach(x => s.set(x.id, x)); renderBody(i); return; }
    }

/* Ordre libre en vue icônes : déposer sur le bord gauche ou droit d'une tuile */
function reorderZone(el, it, e){
  const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;

function canReorder(i, it){

function setBusy(text){ const b = $("#busy"); b.textContent = text || ""; b.classList.toggle("on", !!text); }
function invalidate(acct, keys){ keys.forEach(k => k && cache.delete(ck(acct, k))); cache.delete(ck(acct, "shared")); cache.delete(ck(acct, "starred")); cache.delete(ck(acct, "important")); }

const moveFile = (acct, id, dest, from) => api(acct, "PATCH", "files/" + encodeURIComponent(id), {query:{addParents:dest, removeParents:from || undefined, supportsAllDrives:true, fields:"id"}, body:{}});

async function doMove(items, target){
  const acct = target.acct;
  items = items.filter(it => it.id !== target.id && keyOf(acct, it.parentId) !== target.id);
  if (!items.length) return;
  if (S.confirm && !(await confirmDlg("Déplacer " + labelOf(items) + " vers « " + clean(target.title) + " » ?"))) return;
  const dest = destOf(target);
  const keys = new Set([target.id]); items.forEach(it => keys.add(keyOf(acct, it.parentId)));
  const ops = [], errs = [], movedFolders = new Set();
  setBusy("Déplacement…");
  for (const it of items) {
    try { await moveFile(acct, it.id, dest, it.parentId); ops.push({t:"move", acct, id:it.id, title:it.title, from:it.parentId, to:dest}); if (isFolder(it)) movedFolders.add(it.id); }
    catch (e) { errs.push([it, e]); }
  }
  setBusy("");
  const restorePaths = [];
  const tpath = (target.path && target.path.length) ? target.path : [rootEntry(acct, "root")];
  S.panes.forEach((p, i) => {
    if (p.path[0].acct !== acct) return;
    const k = p.path.findIndex(c => movedFolders.has(c.id));
    if (k > 0) { restorePaths.push([i, p.path.slice()]); p.path = [...tpath, ...p.path.slice(k)]; }
    if (p.preview && items.some(it => it.id === p.preview.id)) p.preview = null;
  });
  invalidate(acct, keys); sel.forEach(s => s.clear());
  if (ops.length) {
    setUndo({ops, restorePaths, keys:[[acct, [...keys]]]});
    toast(labelOf(ops) + " déplacé" + (ops.length > 1 ? "s" : "") + " vers « " + clean(target.title) + " ».", {undo:true});
  }
  errs.forEach(([it, e]) => toast("« " + clean(it.title) + " » n'a pas été déplacé. " + errMsg(e), {err:true, ms:9000}));
  refreshAll();
}

/* Copie (même compte ou entre comptes) et transfert entre comptes */
async function copyFileTo(it, dstAcct, parent){
  const body = {name:it.title, parents:[parent]};
  const q = {supportsAllDrives:true, fields:"id"};
  if (it.acct === dstAcct) return (await api(dstAcct, "POST", "files/" + encodeURIComponent(it.id) + "/copy", {query:q, body})).id;
  try { return (await api(dstAcct, "POST", "files/" + encodeURIComponent(it.id) + "/copy", {query:q, body})).id; }
  catch (e) { if (e.code === "needs_auth" || (e.status !== 404 && e.status !== 403)) throw e; }
  // Le compte de destination ne voit pas le fichier : accès en lecture temporaire accordé par le compte source
  const perm = await api(it.acct, "POST", "files/" + encodeURIComponent(it.id) + "/permissions",
    {query:{sendNotificationEmail:false, supportsAllDrives:true, fields:"id"}, body:{type:"user", role:"reader", emailAddress:ACCTS[dstAcct].email}});
  try {
    try { return (await api(dstAcct, "POST", "files/" + encodeURIComponent(it.id) + "/copy", {query:q, body})).id; }
    catch (e) { if (e.status !== 404) throw e; await sleep(1500); return (await api(dstAcct, "POST", "files/" + encodeURIComponent(it.id) + "/copy", {query:q, body})).id; }
  } finally {
    api(it.acct, "DELETE", "files/" + encodeURIComponent(it.id) + "/permissions/" + perm.id, {query:{supportsAllDrives:true}}).catch(() => {});
  }
}
async function doTransfer(items, target, isMove){
  const dst = target.acct, dest = destOf(target);
  if (!connected(dst)) { toast(errMsg({code:"needs_auth", acct:dst}), {err:true}); return; }
  const ops = [], errs = [], kept = []; let n = 0;
  const tick = () => { n++; setBusy((isMove ? "Transfert" : "Copie") + " : " + n + " élément" + (n > 1 ? "s" : "") + "…"); };
  async function copyTree(it, parent){
    if (isFolder(it)) {
      const f = await api(dst, "POST", "files", {query:{supportsAllDrives:true, fields:"id"}, body:{name:it.title, mimeType:FOLDER, parents:[parent]}});
      tick();
      let kids = [];
      try { kids = (await fetchFolder(it.acct, it.id, {force:true})).items; } catch (e) { errs.push([it, e]); }
      let ok = true;
      for (const k of kids) { try { await copyTree(k, f.id); } catch (e) { ok = false; errs.push([k, e]); } }
      return {id:f.id, complete:ok};
    }
    const id = await copyFileTo(it, dst, parent);
    tick();
    return {id, complete:true};
  }
  setBusy(isMove ? "Transfert…" : "Copie…");
  for (const it of items) {
    let r;
    try { r = await copyTree(it, dest); ops.push({t:"trash", acct:dst, id:r.id, title:it.title}); }
    catch (e) { errs.push([it, e]); continue; }
    if (isMove) {
      if (!r.complete) { kept.push(it); continue; }
      try { await trashFile(it.acct, it.id, true); ops.push({t:"untrash", acct:it.acct, id:it.id, title:it.title}); }
      catch (e) { kept.push(it); }
    }
  }
  setBusy("");
  invalidate(dst, new Set([target.id]));
  if (isMove) invalidate(items[0].acct, new Set(items.map(it => keyOf(it.acct, it.parentId))));
  sel.forEach(s => s.clear());
  const done = ops.filter(o => o.t === "trash");
  if (done.length) {
    setUndo({ops, restorePaths:[], keys:[]});
    toast(labelOf(done) + (isMove ? " transféré" : " copié") + (done.length > 1 ? "s" : "") + " vers « " + clean(target.title) + " » (compte " + ACCTS[dst].label + ")" + (n > done.length ? ", " + n + " éléments au total" : "") + ".", {undo:true});
  }
  if (kept.length) toast("Copié, mais l'original de " + labelOf(kept) + " est resté en place (copie incomplète ou mise à la corbeille refusée : seul le propriétaire peut le faire).", {err:true, ms:11000});
  errs.slice(0, 4).forEach(([it, e]) => toast("« " + clean(it.title) + " » : " + errMsg(e), {err:true, ms:9000}));
  if (errs.length > 4) toast((errs.length - 4) + " autres éléments n'ont pas pu être copiés.", {err:true, ms:9000});
  refreshAll();
}

function paneOfItem(it){ for (let i = 0; i < S.count; i++) if (sel[i].has(it.id)) return i; return -1; }
async function doTrash(items){
  if (!items.length) return;
  const acct = items[0].acct;
  const nF = items.filter(isFolder).length;
  const what = items.length > 1 ? items.length + " éléments" + (nF ? " (dont " + nF + " dossier" + (nF > 1 ? "s" : "") + " avec leur contenu)" : "") : "« " + clean(items[0].title) + " »" + (nF ? " et tout son contenu" : "");
  if (!(await confirmDlg("Mettre " + what + " à la corbeille du compte " + ACCTS[acct].label + " ? " + (items.length > 1 ? "Ils resteront récupérables" : "Il restera récupérable") + " 30 jours dans la corbeille de Drive.", "Mettre à la corbeille"))) return;
  const ops = [], errs = [], keys = new Set(), gone = new Set();
  setBusy("Mise à la corbeille…");
  for (const it of items) {
    try { await trashFile(it.acct, it.id, true); ops.push({t:"untrash", acct:it.acct, id:it.id, title:it.title}); keys.add(keyOf(it.acct, it.parentId)); gone.add(it.id); }
    catch (e) { errs.push([it, e]); }
  }
  setBusy("");
  const restorePaths = [];
  S.panes.forEach((p, i) => {
    if (p.path[0].acct !== acct) return;
    const k = p.path.findIndex(c => gone.has(c.id));
    if (k > 0) { restorePaths.push([i, p.path.slice()]); p.path = p.path.slice(0, k); }
    if (p.preview && gone.has(p.preview.id)) p.preview = null;
  });
  invalidate(acct, keys); sel.forEach(s => s.clear());
  if (ops.length) {
    setUndo({ops, restorePaths, keys:[]});
    toast(labelOf(ops) + " mis" + (ops.length > 1 ? "" : "") + " à la corbeille.", {undo:true});
  }
  errs.forEach(([it, e]) => toast("« " + clean(it.title) + " » n'a pas été mis à la corbeille. " + (e && e.status === 403 ? "Seul le propriétaire (" + (it.owner || "autre compte") + ") peut le faire." : errMsg(e)), {err:true, ms:9000}));
  refreshAll();
}
async function undo(){
  const b = undoBatch; if (!b) return;
  setUndo(null);
  const errs = [];
  setBusy("Annulation…");
  for (const o of b.ops.slice().reverse()) {
    try {
      if (o.t === "move") await moveFile(o.acct, o.id, o.from, o.to);
      else if (o.t === "rename") await api(o.acct, "PATCH", "files/" + encodeURIComponent(o.id), {query:{supportsAllDrives:true, fields:"id"}, body:{name:o.from}});
      else if (o.t === "trash") await trashFile(o.acct, o.id, true);
      else if (o.t === "untrash") await trashFile(o.acct, o.id, false);
    } catch (e) { errs.push([o, e]); }
  }
  setBusy("");
  b.restorePaths.forEach(([i, path]) => { S.panes[i].path = path; });
  cache.clear();
  errs.forEach(([o, e]) => toast("Annulation incomplète pour « " + clean(o.title) + " ». " + errMsg(e), {err:true, ms:9000}));
  if (!errs.length) toast("Opération annulée" + (b.ops.some(o => o.t === "trash") ? " : les copies sont dans la corbeille." : b.ops.every(o => o.t === "untrash") ? " : les éléments sont revenus à leur place." : "."));
  sel.forEach(s => s.clear());
  refreshAll();
}

/* ===== Recherche dans tout le Drive ===== */
function toggleSearch(i, force){
  const z = srch[i]; z.open = force != null ? force : !z.open;
  if (!z.open) { z.q = ""; z.results = null; z.err = null; z.loading = false; z.seq++; }
  renderPane(i);
  if (z.open) { const inp = paneEls[i].querySelector(".sbar input[type=search]"); if (inp) inp.focus(); }
}
let sTimer = null;
function queueSearch(i){ clearTimeout(sTimer); sTimer = setTimeout(() => runSearch(i), 450); }
async function runSearch(i){
  const z = srch[i], acct = S.panes[i].path[0].acct, q = z.q.trim();
  const seq = ++z.seq;
  if (!q) { z.results = null; z.loading = false; z.err = null; renderBody(i); return; }
  if (!connected(acct)) { z.err = {code:"needs_auth"}; renderBody(i); return; }
  z.loading = true; z.err = null; renderBody(i);
  const words = q.split(/\s+/).filter(Boolean).slice(0, 6);
  const cond = words.map(w => (z.content ? "fullText contains '" : "name contains '") + qid(w) + "'").join(" and ");
  const query = {q:cond + " and trashed = false", fields:FIELDS, pageSize:200, corpora:"allDrives", supportsAllDrives:true, includeItemsFromAllDrives:true};
  if (!z.content) query.orderBy = "folder,modifiedTime desc";
  try {
    const res = await api(acct, "GET", "files", {query});
    if (seq !== z.seq) return;
    z.results = (res.files || []).map(f => mapFile(f, acct)); z.trunc = !!res.nextPageToken;
    z.loading = false; renderBody(i);
    fillParentNames(i, acct, z.results, seq);
  } catch (e) { if (seq !== z.seq) return; z.loading = false; z.err = e; renderBody(i); }
}
function parentLabel(acct, it){

  if (!pid) return it.driveId ? "Disque partagé" : "Partagé avec moi";
  if (pid === ACCTS[acct].rootId) return "Mon Drive";

}
async function fillParentNames(i, acct, items, seq){
  const need = [...new Set(items.map(x => x.parentId).filter(pid => pid && pid !== ACCTS[acct].rootId && !ACCTS[acct].drives.some(d => d.id === pid) && !nameCache.has(ck(acct, pid))))].slice(0, 60);
  let n = 0;
  const work = async () => { while (n < need.length) { const pid = need[n++];
    try { const f = await api(acct, "GET", "files/" + encodeURIComponent(pid), {query:{fields:"id,name", supportsAllDrives:true}}); nameCache.set(ck(acct, pid), f.name); }
    catch (e) { nameCache.set(ck(acct, pid), "(dossier inaccessible)"); } } };
  await Promise.all([work(), work(), work(), work()]);
  if (srch[i].seq === seq && srch[i].open) renderBody(i);
}
async function revealItem(i, it){

/* ===== Rendu ===== */
function itemsOf(acct, id, p, applyFilter){
  const e = cache.get(ck(acct, id)); if (!e) return null;
  let arr = e.items.slice();
  const f = applyFilter ? p.filter.trim().toLowerCase() : "";
  if (f) arr = arr.filter(x => (x.title || "").toLowerCase().includes(f));
  if (applyFilter && p.impOnly && id !== "important") arr = arr.filter(x => S.marks[x.id]);
  if (p.sort === "custom") {
    const ord = S.order[ck(acct, id)] || [], pos = new Map(ord.map((x, n) => [x, n]));
    arr.sort((a, b) => {
      const pa = pos.has(a.id), pb = pos.has(b.id);

  $("#main").replaceWith(h("div", {class:"setup"},
    h("h2", {}, "Configuration initiale"),
    h("p", {}, "Collez l'ID client OAuth créé dans la console Google Cloud (type « Application Web »). L'origine JavaScript autorisée doit être exactement :"),
    h("p", {}, h("code", {}, location.origin)),
    inp,
    h("button", {class:"pill-btn", style:"background:var(--accent);color:#fff;border-color:var(--accent)", onclick:() => {
      const v = inp.value.trim();
      if (!/\.apps\.googleusercontent\.com$/.test(v)) { toast("Cet identifiant ne ressemble pas à un ID client OAuth Google.", {err:true}); return; }
      try { localStorage.setItem(CFG, JSON.stringify({clientId:v})); } catch(e) {}
      location.reload();
    }}, "Enregistrer et continuer"),
    h("p", {class:"meta", style:"margin-top:14px"}, "L'identifiant est conservé dans ce navigateur uniquement. Il n'est pas secret.")));
}

/* ===== Démarrage ===== */
if (!CLIENT_ID) { setupScreen(); return; }
$("#chkConfirm").addEventListener("change", e => { S.confirm = e.target.checked; save(); });
$("#btnUndo").addEventListener("click", undo);
$("#btnHelp").addEventListener("click", e => { const r = e.target.getBoundingClientRect(); helpMenu(r.right - 380, r.bottom + 8); });
document.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (e.key === "F2" && !/INPUT|TEXTAREA|SELECT/.test(tag) && !document.querySelector(".menu,.modal-bg")) {
    for (let i = 0; i < S.count; i++) if (sel[i].size === 1) { e.preventDefault(); doRename([...sel[i].values()][0]); return; }
  }
  if ((e.key === "Delete" || e.key === "Backspace") && !/INPUT|TEXTAREA|SELECT/.test(tag) && !document.querySelector(".menu,.modal-bg")) {
    for (let i = 0; i < S.count; i++) if (sel[i].size) { e.preventDefault(); doTrash([...sel[i].values()]); return; }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.querySelector(".menu")) { sel.forEach(s => s.clear()); for (let i = 0; i < S.count; i++) renderBody(i); } });
renderTop(); layout();
for (let i = 0; i < 4; i++) renderPane(i);
for (let i = 0; i < S.count; i++) loadPane(i);
resolvePending();
if (pendingFolder && !ACCT_KEYS.some(connected)) { toast("Connectez un compte pour ouvrir le dossier demandé depuis Drive.", {ms:15000}); const t = document.querySelector(".toast:last-child"); if (t) t.classList.add("pending"); }
let lastSync = 0;
function stamp(){ lastSync = Date.now(); const b = $("#btnRefreshAll"); if (b) b.title = "Dernière actualisation : " + new Date(lastSync).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}) + ". Cliquer pour tout relire depuis Google Drive."; }
$("#btnRefreshAll").addEventListener("click", () => { cache.clear(); refreshAll(); stamp(); toast("Tous les cadrans ont été relus depuis Google Drive."); });
const sig = e => e ? e.items.map(x => x.id + "|" + x.title + "|" + x.modifiedTime + "|" + x.parentId).join(";") : "";
async function autoRefresh(){
  if (document.visibilityState === "visible") syncRun();
  if (document.visibilityState !== "visible" || drag || document.querySelector(".menu,.modal-bg") || $("#busy").classList.contains("on")) return;
  for (let i = 0; i < S.count; i++) {
    const acct = S.panes[i].path[0].acct;
    if (!connected(acct)) continue;
    let changed = false;
    for (const id of idsShown(i)) {
      const before = sig(cache.get(ck(acct, id)));
      try { const after = sig(await fetchFolder(acct, id, {force:true})); if (after !== before) changed = true; } catch (e) {}
    }
    if (changed && !drag && i < S.count) renderBody(i);
  }
  stamp();
}
setInterval(autoRefresh, 60000);
setTimeout(syncRun, 800);
$("#syncSt").addEventListener("click", async () => {
  if (syncMissing.length) { for (const k of [...syncMissing]) { try { await connect(k); } catch(e) { return; } } return; }
  syncRun(true);
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { syncRun(); if (Date.now() - lastSync > 60000) autoRefresh(); } });
window.addEventListener("focus", () => syncRun());
stamp();
setInterval(() => { for (const k of ACCT_KEYS) { const a = ACCTS[k]; if (a.token && a.exp < Date.now()) needAuth(k); } }, 30000);
})();
</script>
</body>
</html>
